spring.application.name=connecthub-backend
# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/connecthub_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# MULTIPART & FILE UPLOAD LIMITS
# ===============================
# Enable multipart uploads
spring.servlet.multipart.enabled=true

# Max size of a single file (e.g., 50MB)
spring.servlet.multipart.max-file-size=50MB

# Max size of an entire multi-file request (e.g., 50MB)
spring.servlet.multipart.max-request-size=50MB

# Threshold after which files are written to disk instead of memory
spring.servlet.multipart.file-size-threshold=2KB

