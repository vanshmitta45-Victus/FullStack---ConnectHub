services:
  selenium-hub:
    image: selenium/hub:4.25.0
    ports:
      - "4444:4444"
  chrome-node:
    image: selenium/node-chrome:4.25.0
    depends_on:
      - selenium-hub
    # Grid browsers resolve the dev machine via host.docker.internal; pin it to
    # the bridge gateway (IPv4) since Docker Desktop may expose IPv6 only.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=4
  firefox-node:
    image: selenium/node-firefox:4.25.0
    depends_on:
      - selenium-hub
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
