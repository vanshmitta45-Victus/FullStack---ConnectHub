# ConnectHub wired config (local docker backend)
base.url=http://localhost:5173
api.base.url=http://localhost:8080/api
browser=chrome
headless=true
timeout.seconds=10
grid.enabled=false
grid.url=http://localhost:4444/wd/hub

# ConnectHub Postgres (docker host port 5434 -> container 5432; host 5432 is taken by local Postgres service)
db.url=jdbc:postgresql://localhost:5434/connecthub_db
db.user=postgres
db.password=password123

# Seed demo accounts (frontend quick-login). Tests create unique users instead to stay isolated.
connecthub.admin.user=vansh
connecthub.admin.pass=Password123!
connecthub.member.user=demo_user
connecthub.member.pass=Password123!
